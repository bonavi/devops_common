---
- name: Update apt cache
  apt:
    update_cache: yes
    force_apt_get: yes

- name: Install prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
    state: present

# apt-key убран из Ubuntu 26.04: ключ репозитория кладём в /etc/apt/keyrings и подключаем через signed-by
- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker's GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

# Серверы, настроенные старой версией роли: строка репозитория без signed-by конфликтует с новой
- name: Remove legacy Docker repository entry (without signed-by)
  apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: absent

- name: Add Docker repository
  apt_repository:
    repo: deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present

- name: Install Docker
  apt:
    name: docker-ce
    state: present
    update_cache: yes

- name: Install docker-compose via apt
  apt:
    name: docker-compose-plugin
    state: present

- name: Enable and start Docker service
  service:
    name: docker
    state: started
    enabled: yes

- name: Add users to docker group
  user:
    name: "{{ item.name }}"
    groups: docker
    append: yes
  loop: "{{ users }}"
  # В выводе только имя пользователя: item содержит пароль
  loop_control:
    label: "{{ item.name }}"
