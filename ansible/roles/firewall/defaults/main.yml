# Пользовательская цепочка, куда собираются все allow-правила периметра.
# INPUT просто передаёт весь трафик на разбор в неё без собственных условий —
# сама фильтрация происходит внутри цепочки.
firewall_chain: FRONTDOOR

# Цепочка в mangle для firewall_tunnels_to_self_only и папка с собранными правилами
firewall_tunnel_chain: TUNNEL_TO_SELF
firewall_rules_dir: /etc/iptables/role-firewall

# Туннели, из которых можно только к самому хосту: пакет с интерфейса с чужим
# адресом назначения отбрасывается до любой маршрутизации и DNAT. Закрывает
# пересылку из туннеля в сеть подов, на ClusterIP и в LAN при ip_forward=1.
#
# firewall_tunnels_to_self_only:
#   - { interface: wg-client-pi, address: 10.20.20.1 }
firewall_tunnels_to_self_only: []

# Список разрешённых входящих портов.
# interface — опционально: ограничивает правило конкретным интерфейсом
# (например wg0), иначе порт открыт с любого интерфейса.
# source — опционально: ограничивает по source IP/CIDR (например конкретное
# устройство в LAN). Слабее interface (IP можно подделать теоретически,
# динамический IP ломает правило молча) — использовать, когда нет отдельного
# интерфейса под нужный источник (весь LAN на одном eth0).
#
# interfaces — то же, но списком: правило на каждый интерфейс (LAN по Wi-Fi и кабелю,
# несколько WG-сетей). interface и interfaces в одном правиле не сочетаются.
#
# firewall_allowed_ports:
#   - { port: 80, protocol: tcp }
#   - { port: 8095, protocol: tcp, interfaces: [wlan0, eth0] }
#   - { port: 443, protocol: tcp }
#   - { port: 6443, protocol: tcp, interface: wg0 }
#   - { port: 1883, protocol: tcp, source: "192.168.1.50/32" }
firewall_allowed_ports: []

# Разрешить входящий ICMP echo-request (ping). У ICMP нет портов, поэтому
# это отдельный тумблер, а не элемент firewall_allowed_ports.
firewall_allow_ping: true

# После того как все ACCEPT-правила применены — поставить default-deny
# policy на INPUT. FRONTDOOR при этом не содержит собственного финального
# DROP: несовпавшие пакеты просто долетают до policy, что не мешает другим
# управляющим цепочкам (например kube-proxy/kube-router на k3s-нодах)
# первыми принять решение по трафику, который им причитается.
firewall_set_input_policy_drop: true

# Default-deny на FORWARD: хост пересылает только то, что явно разрешили другие
# правила. Зачем: при включённом ip_forward (k3s включает его сам) пакет, пришедший
# из WG-туннеля с чужим адресом назначения, ядро переслало бы дальше — в сеть подов,
# на ClusterIP сервисов, в LAN. k3s (flannel, kube-proxy, kube-router) кладёт в
# FORWARD собственные ACCEPT для своего трафика, поэтому с политикой DROP работает
# (проверено на pi 2026-11-11). Хосту, которому нужна пересылка без явных правил,
# выключи в host_vars — обратно на ACCEPT роль политику не возвращает, это вручную.
firewall_set_forward_policy_drop: true

# Хост не пользуется IPv6 — глушить его целиком (policy DROP на INPUT
# и FORWARD в ip6tables, без единого ACCEPT). Если IPv6 всё же нужен —
# выключи и добавь свои ACCEPT-правила отдельно, эта роль их не заводит.
firewall_block_ipv6: true

# Сохранять правила через iptables-persistent, чтобы они переживали reboot.
firewall_persist: true
