- name: Install iptables-persistent
  when: firewall_persist
  block:
    - name: Preseed iptables-persistent to not autosave existing rules on install
      ansible.builtin.debconf:
        name: iptables-persistent
        question: "{{ item }}"
        vtype: boolean
        value: "false"
      loop:
        - iptables-persistent/autosave_v4
        - iptables-persistent/autosave_v6

    - name: Install iptables-persistent package
      ansible.builtin.apt:
        name: iptables-persistent
        state: present
        update_cache: yes

- name: Fail fast if a rule sets both interface and interfaces
  ansible.builtin.assert:
    that:
      - firewall_allowed_ports | selectattr('interface', 'defined') | selectattr('interfaces', 'defined') | list | length == 0
    fail_msg: "В правиле firewall_allowed_ports заданы и interface, и interfaces — оставь одно"

# Цепочки роли пересобираются целиком из конфига при каждом прогоне: убранное из
# host_vars исчезает и с хоста. Подмена атомарная — iptables-restore применяет
# таблицу одной транзакцией, промежутка без правил нет (иначе при INPUT DROP
# оборвался бы SSH, через который идёт прогон). --noflush: остальные цепочки
# таблиц (k3s, kube-router, docker) не трогаются.
- name: Ensure rules directory exists
  ansible.builtin.file:
    path: "{{ firewall_rules_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render {{ firewall_chain }} rules
  ansible.builtin.template:
    src: rules.v4.j2
    dest: "{{ firewall_rules_dir }}/{{ firewall_chain | lower }}.rules"
    owner: root
    group: root
    mode: "0600"
    # Синтаксис проверяется до записи: сломанный шаблон не дойдёт до применения
    validate: iptables-restore --test --noflush %s

- name: Read current rules of the role chains
  ansible.builtin.shell: >-
    iptables -S {{ firewall_chain }} 2>/dev/null;
    iptables -t mangle -S {{ firewall_tunnel_chain }} 2>/dev/null
  register: firewall_before
  changed_when: false

- name: Apply {{ firewall_chain }} rules atomically
  ansible.builtin.command: iptables-restore --noflush {{ firewall_rules_dir }}/{{ firewall_chain | lower }}.rules
  changed_when: false

- name: Read applied rules of the role chains
  ansible.builtin.shell: >-
    iptables -S {{ firewall_chain }} 2>/dev/null;
    iptables -t mangle -S {{ firewall_tunnel_chain }} 2>/dev/null
  register: firewall_after
  changed_when: firewall_after.stdout != firewall_before.stdout

# Из туннеля — только к самому хосту: mangle PREROUTING срабатывает раньше DNAT
# k3s (ClusterIP → под), после которого правила k3s в FORWARD пропускают пакет
# мимо политики DROP
- name: Call {{ firewall_tunnel_chain }} from the top of mangle PREROUTING
  ansible.builtin.iptables:
    table: mangle
    chain: PREROUTING
    jump: "{{ firewall_tunnel_chain }}"
    action: insert
    rule_num: 1
  when: firewall_tunnels_to_self_only | length > 0

# Вставляется первым (-I INPUT 1), но это не гарантирует, что она навсегда
# останется первой строкой: например kube-router на k3s-нодах периодически
# ресинхронизируется и переустанавливает свою цепочку перед любой другой.
# Модуль идемпотентен по содержимому правила, а не по позиции — если jump
# уже существует где-то в INPUT, повторный запуск не будет его двигать.
- name: Call {{ firewall_chain }} from the top of INPUT
  ansible.builtin.iptables:
    chain: INPUT
    jump: "{{ firewall_chain }}"
    action: insert
    rule_num: 1

- name: Set default-deny policy on INPUT
  ansible.builtin.iptables:
    chain: INPUT
    policy: DROP
  when: firewall_set_input_policy_drop

- name: Set default-deny policy on FORWARD
  ansible.builtin.iptables:
    chain: FORWARD
    policy: DROP
  when: firewall_set_forward_policy_drop

# Хост не пользуется IPv6 — глушим весь входящий/транзитный трафик целиком,
# без единого ACCEPT-исключения (в отличие от IPv4-FRONTDOOR выше). Забыть
# про ip6tables — частый способ оставить дыру: IPv4-firewall никак его не
# защищает, у IPv6 полностью отдельный набор правил и своя policy.
- name: Set default-deny policy on IPv6 INPUT
  ansible.builtin.iptables:
    chain: INPUT
    policy: DROP
    ip_version: ipv6
  when: firewall_block_ipv6

- name: Set default-deny policy on IPv6 FORWARD
  ansible.builtin.iptables:
    chain: FORWARD
    policy: DROP
    ip_version: ipv6
  when: firewall_block_ipv6

# Выполняется всегда (не только когда что-то изменилось выше) — правила
# iptables не переживают reboot без этого шага, а любая роль, вызванная
# после этой в том же плейбуке (например reboot), не должна оставить
# только что настроенный firewall несохранённым.
- name: Persist current iptables rules
  ansible.builtin.command: netfilter-persistent save
  when: firewall_persist
  changed_when: false
