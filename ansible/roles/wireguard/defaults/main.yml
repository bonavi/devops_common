---
# roles/wireguard/defaults/main.yml
#
# Один хост может держать несколько независимых WG-интерфейсов сразу
# (например узкоцелевой туннель до другого проекта + отдельный админский) —
# поэтому конфигурация это список, не плоский набор переменных. Разница
# между хабом и spoke'ом в каждой записи списка — не код роли, а то, что
# в неё положили: хаб задаёт listen_port и peers без endpoint (роуминг,
# глава 4 wireguard.md); spoke/клиент listen_port не задаёт, а его peer
# (обычно один — хаб) содержит endpoint и persistent_keepalive.

wireguard_config_dir: /etc/wireguard

# wireguard:
#   - interface: wg0
#     address:                     # список — можно IPv4+IPv6 сразу
#       - "10.10.10.2/24"
#     listen_port: 51820           # опционально: только если этот узел — хаб
#     peers:
#       - name: coin-1
#         public_key: "ABCDEF...="
#         allowed_ips: ["10.10.10.1/32"]
#         endpoint: "coin-1.bonavii.com:51820"   # опционально (роуминг, глава 4)
#         persistent_keepalive: 25                 # опционально, обязателен за NAT
#   - interface: wg-admin
#     address:
#       - "10.20.20.2/24"
#     peers:
#       - name: mac
#         public_key: "ZYXWVU...="
#         allowed_ips: ["10.20.20.3/32"]
wireguard: []

# Приватные ключи — НЕ в этом файле. Map interface → ключ, задаётся в
# host_vars/<host>/secrets.yml под ansible-vault:
#   wireguard_private_keys:
#     wg0: "AAAA...="
#     wg-admin: "BBBB...="
# Дефолта нет намеренно: пустое значение отсекает assert в роли, а не молча
# порождает конфиг с невалидным ключом.
wireguard_private_keys: {}

wireguard_enabled: true
