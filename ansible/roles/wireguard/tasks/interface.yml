---
# roles/wireguard/tasks/interface.yml
# Выполняется для каждого элемента wireguard (loop_var: wg, см. main.yml).

- name: Fail fast if interface name is missing
  ansible.builtin.assert:
    that:
      - wg.interface | default('') | length > 0
    fail_msg: "У одной из записей wireguard не указан interface"

- name: Fail fast if address is missing for {{ wg.interface }}
  ansible.builtin.assert:
    that:
      - wg.address | default([]) | length > 0
    fail_msg: "wireguard[{{ wg.interface }}].address пуст"

# Приватный ключ приходит из ansible-vault (host_vars/<host>/secrets.yml,
# wireguard_private_keys.<interface>). Генерации на хосте больше нет: ключ,
# созданный на месте, существовал в одном экземпляре и терялся вместе с
# диском, а публичный приходилось вычитывать из вывода роли и вручную
# переносить в конфиг другого хоста.
- name: Fail fast if private key is not provided from vault for {{ wg.interface }}
  ansible.builtin.assert:
    that:
      - (wireguard_private_keys[wg.interface] | default('')) | length == 44
    fail_msg: >-
      wireguard_private_keys.{{ wg.interface }} обязателен и должен лежать в
      host_vars/{{ inventory_hostname }}/secrets.yml (ansible-vault).
      Сгенерировать новую пару: wg genkey | tee /dev/stderr | wg pubkey

- name: Deploy {{ wg.interface }}.conf
  ansible.builtin.template:
    src: wireguard.conf.j2
    dest: "{{ wireguard_config_dir }}/{{ wg.interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  # no_log: в конфиг подставляется приватный ключ, и при --diff / -v Ansible
  # вывел бы его целиком в терминал и в логи CI.
  no_log: true
  register: wg_conf_result

# Firewall (открыть listen_port/udp, если задан) — не эта роль, а роль
# firewall (firewall_allowed_ports). Не дублируем управление правилами
# в двух разных местах.

- name: Enable and start {{ wg.interface }}
  ansible.builtin.systemd:
    name: "wg-quick@{{ wg.interface }}"
    enabled: "{{ wireguard_enabled }}"
    state: "{{ 'restarted' if wg_conf_result.changed else 'started' }}"
