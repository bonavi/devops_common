---
# roles/wireguard/tasks/main.yml

- name: Fail fast if no wireguard configuration defined
  ansible.builtin.assert:
    that:
      - wireguard | length > 0
    fail_msg: "wireguard (список конфигураций интерфейсов) пуст — нечего разворачивать"

- name: Install WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present
    update_cache: true

- name: Ensure config dir exists with restricted permissions
  ansible.builtin.file:
    path: "{{ wireguard_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Один интерфейс — отдельный набор задач (interface.yml), потому что loop
# по block'у Ansible не поддерживает; include_tasks с loop — штатный способ
# прогнать несколько шагов на каждый элемент списка.
- name: Configure each WireGuard interface
  ansible.builtin.include_tasks: interface.yml
  loop: "{{ wireguard }}"
  loop_control:
    loop_var: wg
    label: "{{ wg.interface | default('?') }}"
