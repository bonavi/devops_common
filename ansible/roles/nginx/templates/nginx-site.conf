server {
    listen 443 ssl;
    server_name {{ item.name }};

    ssl_certificate {{ item.ssl_certificate_path }};
    ssl_certificate_key {{ item.ssl_key_path }};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        {% if item.basic_auth %}
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        {% endif %}

        proxy_pass {{ item.proxy_to }};
        proxy_http_version 1.1;
        {% if item.host_override is defined %}
        # Бэкенд знает только канонический домен, поэтому наверх уходит он,
        # а куки и редиректы заворачиваются обратно на домен клиента.
        proxy_set_header Host {{ item.host_override }};
        proxy_cookie_domain {{ item.host_override }} {{ item.name }};
        proxy_redirect https://{{ item.host_override }}/ https://{{ item.name }}/;
        {% else %}
        proxy_set_header Host $host;
        {% endif %}

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Тайм-ауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;

        keepalive_timeout 75s;
        keepalive_requests 100;
    }
}

server {
    listen 80;
    server_name {{ item.name }};

    return 301 https://$host$request_uri;
}
