- name: Update apt cache and upgrade packages
  apt:
    update_cache: yes
    upgrade: dist

- name: Disable Swap
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove Swap from /etc/fstab
  lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

# /etc/rancher/k3s/config.yaml — единственный конфиг-файл, который k3s
# гарантированно читает и при установке, и при каждом рестарте сервиса
# (задокументированное поведение, в отличие от config.yaml.d — его
# поддержку для конкретной версии k3s стоит проверять отдельно, не
# полагаемся на неё здесь). blockinfile патчит только СВОЙ помеченный
# блок внутри файла — не трогает остальное содержимое, если оно там
# появится другим путём, идемпотентно (повторный запуск не дублирует),
# и сам себя убирает, если условие перестало выполняться.
# tls-san добавляется, только если у хоста задан wireguard (список
# интерфейсов роли wireguard; берутся адреса всех интерфейсов) — иначе apiserver сгенерирует
# сертификат без SAN на WG-IP, и kubectl/curl через туннель будет падать
# с "x509: certificate is valid for ..., not <wg-ip>". tls-san в k3s
# аддитивен — расширяет автоматически определяемый список SAN, не заменяет
# его, так что уже обнаруженные адреса (реальный IP хоста, ClusterIP,
# loopback) остаются в сертификате как были.
- name: Ensure /etc/rancher/k3s directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Patch tls-san into k3s config.yaml
  ansible.builtin.blockinfile:
    path: /etc/rancher/k3s/config.yaml
    create: yes
    owner: root
    group: root
    mode: '0644'
    marker: "# {mark} ANSIBLE MANAGED BLOCK - wireguard tls-san"
    block: |
      tls-san:
      {% for ip in wireguard | map(attribute='address') | flatten | map('regex_replace', '/.*$', '') | unique %}
        - "{{ ip }}"
      {% endfor %}
  when: (wireguard | default([])) | length > 0
  notify: Restart k3s

# На свежем сервере config.yaml ещё нет — убирать блок не из чего
- name: Check k3s config.yaml exists
  ansible.builtin.stat:
    path: /etc/rancher/k3s/config.yaml
  register: k3s_config_file
  when: (wireguard | default([])) | length == 0

- name: Remove tls-san block when wireguard is not set
  ansible.builtin.blockinfile:
    path: /etc/rancher/k3s/config.yaml
    marker: "# {mark} ANSIBLE MANAGED BLOCK - wireguard tls-san"
    state: absent
  when:
    - (wireguard | default([])) | length == 0
    - k3s_config_file.stat.exists
  notify: Restart k3s

- name: Install k3s using official script
  shell: |
    curl -sfL https://get.k3s.io | sh -s - \
    --write-kubeconfig-mode 644 \
    --disable traefik \
    --disable servicelb
  environment:
    INSTALL_K3S_EXEC: "server"
  args:
    creates: /usr/local/bin/k3s

- name: Wait for k3s to be ready
  shell: kubectl get nodes
  register: nodes_output
  until: '" Ready " in nodes_output.stdout'
  retries: 10
  delay: 5

- name: Get Kubeconfig to local machine
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "~/Desktop/k3s-config.yaml"
    flat: yes
