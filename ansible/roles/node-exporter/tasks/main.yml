- name: Copy node-exporter files to the server
  template:
    src: "{{ item.src }}"
    dest: "{{ project_dir }}/{{ item.dest }}"
  loop:
    - { src: docker-compose.node-exporter.yml, dest: docker-compose.node-exporter.yml }

- name: Pull new version of node-exporter image
  command: docker compose -f {{ project_dir }}/docker-compose.node-exporter.yml pull
  args:
    chdir: "{{ project_dir }}"

- name: Down node-exporter
  command: docker compose -f {{ project_dir }}/docker-compose.node-exporter.yml down
  args:
    chdir: "{{ project_dir }}"

- name: Run node-exporter
  command: docker compose -f {{ project_dir }}/docker-compose.node-exporter.yml up -d
  args:
    chdir: "{{ project_dir }}"
