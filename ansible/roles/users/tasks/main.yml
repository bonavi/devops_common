- name: Create users
  user:
    name: "{{ item.name }}"
    create_home: yes
    password: "{{ item.password | password_hash('sha512') }}"
    shell: /bin/bash
    state: present
    groups: "{{ item.groups | default([]) }}"
  loop: "{{ users }}"
  # В выводе только имя пользователя: иначе Ansible печатает весь item вместе с паролем
  loop_control:
    label: "{{ item.name }}"
  # Аргументы модуля содержат хеш пароля — не показываем их даже при ошибке
  no_log: true

- name: Add SSH public key for each user
  ansible.builtin.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_key_pub }}"
    state: present
  loop: "{{ users }}"
  # В выводе только имя пользователя: item содержит пароль
  loop_control:
    label: "{{ item.name }}"
  when: item.ssh_key_pub is defined and item.ssh_key_pub | length > 0

- name: Configure sudoers for user
  copy:
    dest: "/etc/sudoers.d/{{ item.name }}"
    content: "{{ item.sudoers_rules | join('\n') }}\n"
    mode: '0440'
    validate: visudo -cf %s
  loop: "{{ users }}"
  # В выводе только имя пользователя: item содержит пароль
  loop_control:
    label: "{{ item.name }}"
  when: item.sudoers_rules is defined and item.sudoers_rules | length > 0
